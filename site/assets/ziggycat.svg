<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="ziggycat logo: orange tabby cat head">
  <rect width="96" height="96" rx="20" fill="#0f1114"/>
  <!-- ears -->
  <polygon points="24,52 20,24 42,40" fill="#e8590c"/>
  <polygon points="72,52 76,24 54,40" fill="#e8590c"/>
  <polygon points="27,46 25,31 38,40" fill="#0f1114"/>
  <polygon points="69,46 71,31 58,40" fill="#0f1114"/>
  <!-- head -->
  <ellipse cx="48" cy="56" rx="26" ry="23" fill="#e8590c"/>
  <!-- forehead stripes -->
  <rect x="41" y="36" width="4" height="10" rx="2" fill="#0f1114" opacity="0.55"/>
  <rect x="48" y="34" width="4" height="11" rx="2" fill="#0f1114" opacity="0.55" transform="rotate(8 50 39)"/>
  <rect x="55" y="36" width="4" height="10" rx="2" fill="#0f1114" opacity="0.55" transform="rotate(-8 57 41)"/>
  <!-- cheek stripes -->
  <rect x="24" y="54" width="7" height="3" rx="1.5" fill="#0f1114" opacity="0.45"/>
  <rect x="24" y="60" width="7" height="3" rx="1.5" fill="#0f1114" opacity="0.45"/>
  <rect x="65" y="54" width="7" height="3" rx="1.5" fill="#0f1114" opacity="0.45"/>
  <rect x="65" y="60" width="7" height="3" rx="1.5" fill="#0f1114" opacity="0.45"/>
  <!-- eyes -->
  <ellipse cx="38" cy="55" rx="5" ry="6" fill="#0f1114"/>
  <ellipse cx="58" cy="55" rx="5" ry="6" fill="#0f1114"/>
  <circle cx="39.5" cy="53" r="1.6" fill="#ece8e2"/>
  <circle cx="59.5" cy="53" r="1.6" fill="#ece8e2"/>
  <!-- nose + mouth -->
  <polygon points="48,62 44,66 52,66" fill="#0f1114"/>
  <path d="M48 66 v3 M48 69 q-4 4 -8 2 M48 69 q4 4 8 2" stroke="#0f1114" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#ece8e2" stroke-width="1.2" opacity="0.7" stroke-linecap="round">
    <line x1="14" y1="60" x2="28" y2="62"/>
    <line x1="14" y1="66" x2="28" y2="65"/>
    <line x1="82" y1="60" x2="68" y2="62"/>
    <line x1="82" y1="66" x2="68" y2="65"/>
  </g>
</svg>
