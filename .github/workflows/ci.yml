name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
          - os: macos-latest
            target: aarch64-macos
          - os: windows-latest
            target: x86_64-windows

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'

      - name: Build
        run: zig build -Doptimize=ReleaseSmall

      - name: Test
        run: zig build test

      - name: Smoke tests
        shell: bash
        run: |
          set -ex
          B="zig-out/bin/zcat$( [ "$RUNNER_OS" = "Windows" ] && echo .exe)"
          "$B" --version
          # -n numbers blanks GNU-style, -b skips them
          printf 'a\n\nb\n' | "$B" -n | grep -q '^     1\\ta'
          printf 'a\n\nb\n' | "$B" -b >.ci-exp
          printf '     1\ta\n\n     2\tb\n' >.ci-want
          cmp .ci-exp .ci-want || { echo "-b mismatch"; exit 1; }
          # -T tabs as ^I, -E ends as $, -s squeezes blanks
          printf '\tx\n' | "$B" -T | grep -q '\^I'
          printf 'a\n' | "$B" -E | grep -q 'a\$'
          printf 'a\n\n\nb\n' | "$B" -s | grep -c '^$' | grep -q '^1$'
          # JSON + stdin
          "$B" --json src/Cat.zig | grep -q '"files"'
          printf 'hi' | "$B" --json | grep -q '"path":"-"'
          # errors: missing file and directory -> exit 1, message on stderr
          if "$B" /definitely/missing >/dev/null 2>.ci-err; then echo "missing file rc"; exit 1; fi
          grep -q 'no such file' .ci-err || { echo "missing file msg"; exit 1; }
          mkdir -p .ci-dir
          if "$B" .ci-dir >/dev/null 2>.ci-err; then echo "dir rc"; exit 1; fi
          grep -q 'is a directory' .ci-err || { echo "dir msg"; exit 1; }
          # broken pipe -> 141 (SIGPIPE semantics), silent
          if [ "$RUNNER_OS" != "Windows" ]; then
            yes x | head -c 2000000 | "$B" 2>/dev/null | head -c 1 >/dev/null
            [ "${PIPESTATUS[2]}" -eq 141 ] || { echo "pipe rc ${PIPESTATUS[2]} (want 141)"; exit 1; }
          fi
          rm -rf .ci-dir .ci-exp .ci-want .ci-err

      - name: Check binary size
        shell: bash
        run: |
          SIZE=$(wc -c < zig-out/bin/zcat 2>/dev/null || wc -c < zig-out/bin/zcat.exe)
          echo "Binary size: $SIZE bytes (limit 600000)"
          [ "$SIZE" -le 600000 ] || { echo "FAIL: binary too large"; exit 1; }

      - name: Rename binary
        shell: bash
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd zig-out/bin
          mv zcat* zcat-${{ matrix.target }}
          ls -la zcat-${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: zcat-${{ matrix.target }}
          path: zig-out/bin/zcat-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/zcat-*/zcat-*